server:
  port: 8085
spring:
  application:
    name: movie-plus
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.150.101:3306/movie_ticket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&autoReconnect=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
  data:
    redis:
      database: 0
      host: 192.168.150.101
      port: 6379
      password: 123456
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1    
  servlet:
    multipart:
      # 全局文件上传限制（Spring Boot 在 HTTP 层先拦一遍，超限直接返回 413）
      # 必须 <= oss.max-size-mb，否则会出现 "Service 允许 10MB 但 HTTP 拦在 1MB" 的矛盾
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
      # 临时文件目录（默认系统临时目录即可，注释出来是提醒不要放 C 盘）
      # location: D:/tmp/multipart
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
  kafka:
    # Kafka 地址（可用环境变量覆盖）
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.150.101:9092}
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      # 秒杀下单消费组
      group-id: seckill_voucher_order_group
      # 手动提交由 ack-mode=record 控制
      enable-auto-commit: false
      # 没有初始 offset 时从最早的消息开始消费，避免遗漏下单消息
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # 每条消息处理成功后提交 offset，配合唯一索引实现至少一次 + 幂等
      ack-mode: record
mybatis-plus:
  type-aliases-package: org.javaup.entity # 别名扫描包
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
# logging 完全由 logback-spring.xml 控制，这里留空
logging: {}
bloom-filter:
  filters:
    movie:
      name: movie-id-bloom
      expected-insertions: 50000
      false-probability: 0.01
    schedule:
      name: schedule-id-bloom
      expected-insertions: 100000
      false-probability: 0.01
    phone:
      name: phone-bloom
      expected-insertions: 1000000
      false-probability: 0.01
# ========== 登录模块配置 ==========
auth:
  # JWT 签名密钥（生产环境必须通过环境变量 AUTH_JWT_SECRET 注入！）
  jwt-secret: ${AUTH_JWT_SECRET}
  # Access Token 有效期（分钟）
  access-token-expire-minutes: 5
  # Refresh Token 有效期（天）
  refresh-token-expire-days: 7
  # Refresh Token Cookie 名称
  refresh-token-cookie-name: refresh_token
  # Cookie Domain（空为当前域）
  refresh-token-cookie-domain: ""
  # Cookie Path
  refresh-token-cookie-path: /
  # 是否启用 Secure Cookie（生产环境必须启用，需要 HTTPS）
  cookie-secure: false
  # Cookie SameSite 策略
  cookie-same-site: Lax

# ========== 阿里云 OSS 对象存储 ==========
# ⚠️ 安全警告：AccessKey 是敏感凭证，严禁提交到仓库！
#   - 本地/生产都必须通过环境变量注入：
#     Windows(PowerShell):  $env:OSS_ACCESS_KEY_ID="xxx"  $env:OSS_ACCESS_KEY_SECRET="xxx"
#     Linux / Docker:       -e OSS_ACCESS_KEY_ID=xxx -e OSS_ACCESS_KEY_SECRET=xxx
#   - 也可在启动命令中加：--oss.access-key-id=xxx --oss.access-key-secret=xxx
#   - 未注入时 OSS 上传功能不可用，其余功能不受影响
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: xiong-movie-ticket
    region: cn-beijing
    # 文件访问域名（CDN 加速或 bucket 外网域名，不填则用 endpoint）
    domain: ""
    # 上传文件的公共路径前缀（按业务分目录）
    # 最终对象 key = prefix + yyyy/MM/dd + 雪花ID + 原扩展名
    prefix: ""
    # 最大上传大小（MB）
    max-size-mb: 3

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  prometheus:
    metrics:
      export:
        enabled: true

# ========== 秒杀模块配置 ==========
seckill:
  kafka:
    # 秒杀下单消息主题
    order-topic: seckill_voucher_order_topic
    # 消费组
    order-group: seckill_voucher_order_group
      
