mybatis-plus:
  type-aliases-package: org.javaup.entity # 别名扫描包
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
# logging 完全由 logback-spring.xml 控制，这里留空
logging: {}
bloom-filter:
  filters:
    movie:
      name: movie-id-bloom
      expected-insertions: 50000
      false-probability: 0.01
    schedule:
      name: schedule-id-bloom
      expected-insertions: 100000
      false-probability: 0.01
# ========== 登录模块配置 ==========
auth:
  # JWT 签名密钥（生产环境必须通过环境变量 AUTH_JWT_SECRET 注入！）
  jwt-secret: ${AUTH_JWT_SECRET:movie-ticket-master-jwt-secret-key-256-bit-long-string-please-change}
  # Access Token 有效期（分钟）
  access-token-expire-minutes: 30
  # Refresh Token 有效期（天）
  refresh-token-expire-days: 7
  # Refresh Token Cookie 名称
  refresh-token-cookie-name: refresh_token
  # Cookie Domain（空为当前域）
  refresh-token-cookie-domain: ""
  # Cookie Path
  refresh-token-cookie-path: /
  # 是否启用 Secure Cookie（生产环境必须启用，需要 HTTPS）
  cookie-secure: false
  # Cookie SameSite 策略
  cookie-same-site: Lax

# ========== 阿里云 OSS 对象存储 ==========
# ⚠️ 安全警告：AccessKey 是敏感凭证，严禁提交到仓库！
#   - 本地/生产都必须通过环境变量注入：
#     Windows(PowerShell):  $env:OSS_ACCESS_KEY_ID="xxx"  $env:OSS_ACCESS_KEY_SECRET="xxx"
#     Linux / Docker:       -e OSS_ACCESS_KEY_ID=xxx -e OSS_ACCESS_KEY_SECRET=xxx
#   - 也可在启动命令中加：--oss.access-key-id=xxx --oss.access-key-secret=xxx
#   - 未注入时 OSS 上传功能不可用，其余功能不受影响
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: xiong-movie-ticket
    region: cn-beijing
    # 文件访问域名（CDN 加速或 bucket 外网域名，不填则用 endpoint）
    domain: ""
    # 上传文件的公共路径前缀（按业务分目录）
    # 最终对象 key = prefix + yyyy/MM/dd + 雪花ID + 原扩展名
    prefix: ""
    # 最大上传大小（MB）
    max-size-mb: 10

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  prometheus:
    metrics:
      export:
        enabled: true
      
