server:
  port: 8085
spring:
  application:
    name: movie-plus
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.150.101:3306/movie_ticket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&autoReconnect=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
  data:
    redis:
      database: 0
      host: 192.168.150.101
      port: 6379
      password: 123456
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1    
  servlet:
    multipart:
      # 全局文件上传限制（Spring Boot 在 HTTP 层先拦一遍，超限直接返回 413）
      # 必须 <= oss.max-size-mb，否则会出现 "Service 允许 10MB 但 HTTP 拦在 1MB" 的矛盾
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
      # 临时文件目录（默认系统临时目录即可，注释出来是提醒不要放 C 盘）
      # location: D:/tmp/multipart
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
